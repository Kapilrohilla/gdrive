services:
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    volumes:
      - ./.data/redis:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clouddrive

volumes:
  redis_data:
  postgres_data: